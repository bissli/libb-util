[pytest]
testpaths = src,tests
norecursedirs = .git tmp *.egg .eggs dist build proto __pycache__

addopts =
    --ignore-glob='**/__pycache__/*'
    --ignore-glob='**/.pyc'
    --doctest-glob='doctest.rst'
    --doctest-continue-on-failure
    --capture=no
    -p no:logging

filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning
    ignore:ssl.PROTOCOL_TLS is deprecated:DeprecationWarning
    # libb._libb declares gil_used = true, so a free-threaded interpreter
    # re-enables the GIL to load it and warns. That is the intended
    # conservative path until the Rust crate is audited for free-threading,
    # not a defect, so the suite must still run there.
    ignore:The global interpreter lock \(GIL\) has been enabled:RuntimeWarning
    # python-magic-bin, the only Windows wheel that ships libmagic, writes
    # `result is -1` in magic/magic.py, and its last release predates the
    # SyntaxWarning Python 3.8 added for it. The module field pins the
    # ignore to that file.
    ignore:"is" with .*literal:SyntaxWarning:.*magic.magic$
