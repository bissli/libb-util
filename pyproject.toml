[project]
name = "libb-util"
version = "0.0.49"
readme = "README.md"
description = "libb utility modules for python"
authors = [{name = "bissli", email = "bissli@xyz.org"}]
license = {text = "0BSD"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "backoff",
    "python-dateutil",
    "regex",
    "titlecase>=2.4.1",
    "more-itertools",
    "wrapt",
    "psutil",
    "requests",
    "tqdm",
    "trace-dkey==0.0.6",
    "platformdirs",
    "typing-extensions",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
math = ["matplotlib"]
# chardet is capped below 6 deliberately. smart_base64 falls back to
# chardet.detect() for a byte run that is not valid in the declared charset,
# and the guess for the 4-byte fragment b'\xbd/83' changed after 5.x: 6.x
# gives up entirely and 7.x reads it as MacRoman, either way turning a
# decoded '1/2' into mojibake. The cap restores the bound
# [tool.poetry.dependencies] has always declared and that was dropped when
# the extras moved to [project].
text = ["ftfy>=6.1.3", "rapidfuzz>=3.6.1", "chardet>=5.2.0,<6"]
pandas = ["pyarrow", "pandas", "pandas-downcast==1.2.4", "numexpr"]
web = ["Twisted", "service-identity", "Flask"]
twd = ["Twisted", "service-identity"]
ldapauth = ["ldap3"]
tokenauth = ["boto3", "anyio"]
test = ["asserts", "pytest", "pytest-mock", "pytest-benchmark", "WebTest", "maturin>=1.0,<2.0", "exceptiongroup", "jinja2"]
deploy = ["bump2version"]
docs = ["Sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints", "myst-parser", "sphinx-copybutton"]

[project.scripts]
libb-tokenauth = "libb.tokenauth:run_cli"

[tool.poetry]
name = "libb-util"
version = "0.0.49"
readme = "README.md"
description = "libb utility modules for python"
authors = ["bissli"]
license = "0BSD"
packages = [{ include = "libb", from = "src" }]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"

numpy = "*"
backoff = "*"
python-dateutil = "*"
matplotlib = { version = "*", optional = true }
# == text
regex = "*"
titlecase = "^2.4.1"
chardet = { version = "^5.2.0", optional = true }
rapidfuzz = { version = "^3.6.1", optional = true }
ftfy = { version = "^6.1.3", optional = true }
# == general
more-itertools = "*"
wrapt = "*"
psutil = "*"
requests = "*"
tqdm = "*"
trace-dkey = "0.0.6"
platformdirs = "*"
typing-extensions = "*"
# == pandas
pandas-downcast = { version = "1.2.4", optional = true }
pyarrow = { version = "*", optional = true }
pandas = { version = "*", optional = true }
numexpr = { version = "*", optional = true }
# == mimetypes
python-magic = { version = ">=0.4.12", optional = true }
python-magic-bin = { version = ">=0.4.12", markers = "sys_platform == 'win32'", optional = true }
# == web
Flask = { version = "^3.0.2", optional = true }
# == twisted
Twisted = { version = "^23.8.0", optional = true }
service-identity = { version = "*", optional = true }
# == auth
ldap3 = { version = "*", optional = true }
boto3 = { version = "*", optional = true }
anyio = { version = "*", optional = true }
# == test
asserts = { version = "*", optional = true }
pytest = { version = "*", optional = true }
pytest-mock = { version = "*", optional = true }
pytest-benchmark = { version = "*", optional = true }
WebTest = { version = "*", extras = ["web"], optional = true }
maturin = { version = ">=1.0,<2.0", optional = true }
exceptiongroup = { version = "*", python = "<3.11", optional = true }
jinja2 = { version = "*", optional = true }
# == deploy
bump2version = { version = "^1.0.1", optional = true }
# == docs
Sphinx = { version = "^7.0", optional = true }
sphinx-rtd-theme = { version = "^2.0", optional = true }
sphinx-autodoc-typehints = { version = "^2.0", optional = true }
myst-parser = { version = "^3.0", optional = true }
sphinx-copybutton = { version = "^0.5", optional = true }

[tool.poetry.extras]
math = ["matplotlib"]
text = [
  "ftfy",
  "rapidfuzz",
  "chardet",
]
pandas = [
  "pyarrow",
  "pandas",
  "numpy",
  "pandas-downcast",
  "numexpr",
]
web = [
  "Twisted",
  "service-identity",
  "Flask",
]
twd = [
  "Twisted",
  "service-identity",
]
ldapauth = ["ldap3"]
tokenauth = [
  "boto3",
  "anyio",
]
test = [
  "asserts",
  "pytest",
  "pytest-mock",
  "pytest-benchmark",
  "WebTest",
  "maturin",
  "exceptiongroup",
  "jinja2",
]
deploy = ["bump2version"]
docs = [
  "Sphinx",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "myst-parser",
  "sphinx-copybutton",
]

[tool.coverage.run]
source = ["src/libb"]
omit = ["src/libb/chart.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "libb._libb"
features = ["python"]
python-packages = ["libb"]
python-source = "src"
manifest-path = "rust/Cargo.toml"
include = [
  "LICENSE",
  # The Rust vector tests read these via include_str!, so an sdist without
  # them builds fine (the module is #[cfg(test)]) but cannot run its own
  # test suite. sdist-only: the wheel has no use for them.
  { path = "vectors/*.json", format = "sdist" },
  ]
# Notes:
# - maturin walks python-source on the filesystem rather than consulting
#   git, so a path that is gitignored is still packaged. .claude/ is
#   ignored globally and was reaching the wheel for exactly that reason.
# - Byte-compiled output is per-interpreter and must never ship, since a
#   stale .pyc shadows the module it was built from.
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "**/.claude/**",
  ]
