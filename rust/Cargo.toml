[package]
name = "libb_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license-file = "LICENSE"

[lib]
name = "_libb"
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = false

[features]
default = ["python"]
# Notes:
# - `extension-module` tells the linker that Python symbols are resolved by
#   the host interpreter at load time, which makes the resulting cdylib
#   unlinkable from a non-Python process. Gating it behind `python` is what
#   allows `--no-default-features` to produce a plain, libpython-free kernel
#   library.
python = ["pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["generate-import-lib"], optional = true }
once_cell = "1.19"
regex = "1.10"

[dev-dependencies]
serde_json = "1.0"
