name: Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Clippy without the Python layer
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets \
            --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        shell: bash
        run: |
          poetry install -E test -E pandas -E text -E math -E web -E ldapauth -E tokenauth

      - name: Build Rust extension
        shell: bash
        run: |
          poetry run maturin develop --manifest-path rust/Cargo.toml

      - name: Run tests
        shell: bash
        run: poetry run pytest tests/ -v

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Run Rust tests without the Python layer
        run: cargo test --manifest-path rust/Cargo.toml --no-default-features

      - name: Verify the kernel cdylib needs no Python symbols
        run: |
          # extension-module deliberately leaves libpython out of NEEDED and
          # resolves Py* at load time, so `ldd` is clean in BOTH feature
          # configurations. The symbol table is what discriminates.
          cargo build --manifest-path rust/Cargo.toml --no-default-features --release
          SO=rust/target/release/lib_libb.so
          if [ ! -f "$SO" ]; then
            echo "ERROR: $SO was not built"
            exit 1
          fi
          if nm -D --undefined-only "$SO" | grep ' U Py'; then
            echo "ERROR: kernel build still needs Python symbols"
            exit 1
          fi
          if nm -D --defined-only "$SO" | grep PyInit; then
            echo "ERROR: kernel build still exports a Python module init"
            exit 1
          fi
          echo "OK: kernel needs no Python symbols"

      - name: Verify the default build DOES carry the Python layer
        run: |
          # Guards against the gate above passing because the Python layer
          # silently stopped being built at all.
          cargo build --manifest-path rust/Cargo.toml --release
          SO=rust/target/release/lib_libb.so
          nm -D --defined-only "$SO" | grep -q PyInit__libb || {
            echo "ERROR: default build lost its PyInit__libb export"
            exit 1
          }
          test "$(nm -D --undefined-only "$SO" | grep -c ' U Py')" -gt 0 || {
            echo "ERROR: default build resolves no Python symbols"
            exit 1
          }
          echo "OK: default build carries the Python layer"
